# Save docs as a build artifact

name: Generate Configuration Documentation
description: |
    Generate and upload Stacks Core configuration documentation

inputs:
  output:
    description: "Output file for generated documentation"
    required: false
    default: "./node-parameters.md"
  min-doc-size:
    description: "Minimum documentation size in bytes"
    required: false
    default: "50000"
  rust-nightly-version:
    description: "Specific nightly version to use (e.g., 'nightly-2025-06-17')"
    required: false
    default: "nightly-2025-06-17"
  retention-days:
    description: "Number of days to retain the artifact"
    required: false
    default: "90"
  artifact-name:
    description: "Name for the uploaded artifact"
    required: false
    default: "node-parameters-bundle"

runs:
  using: "composite"
  steps:
    # # Checkout the code
    # - name: Checkout the latest code
    #   id: git_checkout
    #   uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    #   with:
    #     ref: ${{ github.event.pull_request.head.sha || github.ref }}

    # Install Rust nightly toolchain with rust-docs-json
    - name: Install Rust nightly toolchain
      id: install_rust
      uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
      with:
        toolchain: ${{ inputs.rust-nightly-version }}
        components: rust-docs-json
        cache: false
    # - name: Setup Rust Toolchain
    #   uses: ./.github/actions/setup-rust-toolchain
    #   with:
    #     toolchain: ${{ inputs.rust-nightly-version }}
    #     components: rust-docs-json
    #     cache: "true"

    # Generate, validate, and summarise configuration documentation
    - name: Generate Configuration Documentation
      shell: bash
      env:
        OUTPUT_FILE: ${{ inputs.output }}
        MIN_DOC_SIZE: ${{ inputs.min-doc-size }}
        PROJECT_ROOT: ${{ github.workspace }}
        RUST_NIGHTLY_VERSION: ${{ inputs.rust-nightly-version }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
      run: bash ./.github/scripts/config_docsgen.sh

    # Upload documentation as artifact
    - name: Upload Documentation Artifact
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.output }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
