name: Build Test Archive Caches
description: |
    Builds nextest test archive caches

runs:
  using: "composite"
  steps:
    ## Check if the test archive cache already exists
    - name: Check Cargo Target Cache
      uses: ./.github/actions/cache/cargo-target
      id: check_target_cache

    - name: Check Test Archive Cache
      uses: ./.github/actions/cache/test-archive
      id: check_test_archive_cache

    - name: echo
      shell: bash
      run: |
          echo "target cache: ${{ steps.check_target_cache.outputs.cache-hit }}"
          echo "test archive cache: ${{ steps.check_test_archive_cache.outputs.cache-hit }}"

    - name: Setup Rust Toolchain
      if: |
        steps.check_target_cache.outputs.cache-hit != 'true' ||
        steps.check_test_archive_cache.outputs.cache-hit != 'true'
      id: setup_rust_toolchain
      uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1
      with:
        components: llvm-tools-preview
        cache: false

    ## Save cache data
    # restore cargo cache
    - name: Restore Cargo Cache
      if: |
        steps.check_target_cache.outputs.cache-hit != 'true' ||
        steps.check_test_archive_cache.outputs.cache-hit != 'true'
      id: restore_cargo_cache
      uses: ./.github/actions/cache/cargo
      with:
        action: restore

    #  Only install dependencies if cache miss (i.e. no existing data)
    - name: Install Dependencies
      if: |
        steps.check_target_cache.outputs.cache-hit != 'true' ||
        steps.check_test_archive_cache.outputs.cache-hit != 'true'
      id: install_dependencies
      uses: taiki-e/install-action@d12e869b89167df346dd0ff65da342d1fb1202fb # v2.53.2
      with:
        tool: nextest, grcov # can be versioned, ex: tool@1.1.1.1

    - name: Build and Archive Tests
      if: |
        steps.check_target_cache.outputs.cache-hit != 'true' ||
        steps.check_test_archive_cache.outputs.cache-hit != 'true'
      id: archive_tests
      shell: bash
      run: |
        export RUSTFLAGS="-C instrument-coverage" && \
        cargo nextest archive \
          --workspace \
          --tests \
          --locked \
          --features monitoring_prom \
          --archive-file ~/test_archive.tar.zst

    - name: Cache Nextest Archive
      if: |
        steps.check_target_cache.outputs.cache-hit != 'true' ||
        steps.check_test_archive_cache.outputs.cache-hit != 'true'
      id: save_nextest_cache
      uses: ./.github/actions/cache/test-archive
      with:
        action: save

    - name: Cache Cargo Target
      if: |
        steps.check_target_cache.outputs.cache-hit != 'true' ||
        steps.check_test_archive_cache.outputs.cache-hit != 'true'
      id: save_target_cache
      uses: ./.github/actions/cache/cargo-target
      with:
        action: save
