name: Target Cache
description: |
    Rust target cache (used for codecov)

inputs:
  action:
    description: "Type of operation (restore,save)"
    required: false
    default: ""
  fail-on-cache-miss:
    description: "Fail workflow if cache is not restorable"
    required: false
    default: "true"
  cache-key:
    description: "Cache Key name"
    required: false
    # default: ${{ github.event.repository.name }}-${{ github.event.pull_request.head.sha || github.sha }}-cargo
    default: ${{ github.event.repository.name }}-target # testing

outputs:
  cache-hit:
    description: "Cache Hit"
    value: ${{ steps.check_cache.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    ## Check if cache data exists
    - name: Check Cache
      if: |
        inputs.action == 'check'
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      id: check_cache
      with:
        lookup-only: true
        path: ./target
        key: ${{ inputs.cache-key }}

    - name: echo cache hit
      shell: bash
      run: |
        echo "inputs.cache-key: ${{ inputs.cache-key }}"
        echo "cache-hit=${{ steps.check_cache.outputs.cache-hit }}"

    ## Restore cache data
    - name: Restore Cache
      if: |
        inputs.action == 'restore'
      id: restore_cache
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}
        path: ./target
        key: ${{ inputs.cache-key }}

    # ## Save cache data
    #  Only save if cache miss (i.e. no existing data)
    - name: Save Cache
      if: |
        inputs.action == 'save'
      id: save_cache
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: ./target
        key: ${{ inputs.cache-key }}
