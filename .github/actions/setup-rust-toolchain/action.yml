# Setup Rust toolchain and optionally any components
name: Setup Rust Toolchain
description: |
  Resolves the Rust toolchain version and installs it via actions-rust-lang/setup-rust-toolchain.
  If `toolchain` is not provided, the version is read from `./rust-toolchain`

inputs:
  toolchain:
    description: Explicit toolchain version (i.e. "nightly").
    required: false
    default: ""
  components:
    description: Comma-separated list of components to install alongside the toolchain
    required: false
    default: ""
  target:
    description: Comma-separated list of additional compilation targets to install
    required: false
    default: ""
  cache:
    description: "Enable the built-in Rust caching provided by the action."
    required: false
    default: "false"

outputs:
  rust-toolchain:
    description: "The resolved Rust toolchain version that was installed."
    value: ${{ steps.resolve-toolchain.outputs.rust-toolchain }}

runs:
  using: "composite"
  steps:
    # Resolve the toolchain: use the explicit input if given, otherwise read ./rust-toolchain.
    - name: Resolve Rust toolchain
      id: resolve-toolchain
      shell: bash
      run: |
        toolchain="${{ inputs.toolchain }}"
        if [[ -z "${toolchain}" ]]; then
          if [[ ! -f ./rust-toolchain ]]; then
            echo "Error: No toolchain input provided and ./rust-toolchain file not found"
            exit 1
          fi
          toolchain="$(cat ./rust-toolchain)"
        fi
        echo "rust-toolchain=${toolchain}" >> "$GITHUB_OUTPUT"

    # Install the resolved toolchain with any requested components and targets.
    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
      with:
        toolchain: ${{ steps.resolve-toolchain.outputs.rust-toolchain }}
        components: ${{ inputs.components }}
        target: ${{ inputs.target }}
        cache: ${{ inputs.cache }}
