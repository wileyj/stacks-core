name: Generate and Upload codecov artifact
description: |
    Generates code coverage data and uploads it to GitHub CI artifact storage

inputs:
  test-name:
    description: "Test name for codecov"
    required: true
  binary-path:
    description: "Binary path"
    required: false
    default: "./target/debug/"

runs:
  using: "composite"
  steps:
    - name: Define Rust toolchain
      id: define-rust-toolchain
      run: echo "rust-toolchain=$(cat ./rust-toolchain)" >> "$GITHUB_OUTPUT"

    - name: Setup Rust Toolchain
      if: |
        steps.check_target_cache.outputs.cache-hit != 'true' ||
        steps.check_test_archive_cache.outputs.cache-hit != 'true'
      uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1
      with:
        toolchain: ${{ needs.setup.outputs.rust-toolchain }}
        components: llvm-tools-preview
        cache: false
