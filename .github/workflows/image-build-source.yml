    image:
        name: Build Image
        runs-on: ubuntu-latest
        ## Requires the repo environment "Push to Docker", which will trigger a secondary approval step before running this workflow.
        environment: "Push to Docker"
        needs:
            # - andon-cord
            - build-binaries
        permissions:
            id-token: write
            attestations: write
        steps:
            - name: Set Docker Org
              id: set_docker_org
              shell: bash
              run: |
                  if [[ "${{ github.repository_owner }}" != "stacks-network" ]]; then
                    var_org="${{ github.repository_owner }}"
                  else
                    var_org="blockstack"
                  fi
                  var_images="${{ env.docker_org }}/${{ github.event.repository.name }} ${{ env.docker_org }}/stacks-blockchain"
                  echo "docker_org=$var_org" >> $GITHUB_ENV
                  echo "docker_images=$var_images" >> $GITHUB_ENV

            - name: Set Local Vars
              id: set_vars
              shell: bash
              run: |
                  if [ "${{ inputs.release_type }}" == "stacks-signer" ]; then
                    # stacks-signer
                    var_images="${{ env.docker_org }}/stacks-signer"
                    var_tag="${{ inputs.signer_tag }}"
                    var_docker_tag=${{ inputs.signer_docker_tag }}
                  else
                    # stacks-node
                    var_images="${{ env.docker_org }}/${{ github.event.repository.name }} ${{ env.docker_org }}/stacks-blockchain"
                    var_tag="${{ inputs.node_tag }}"
                    var_docker_tag=${{ inputs.node_docker_tag }}
                  fi

                  echo
                  echo "var_images: $var_images"
                  echo "inputs.release_type: ${{inputs.release_type}}"
                  echo "var_tag: $var_tag"
                  echo "var_docker_tag: $var_docker_tag"
                  echo
                  echo "docker_images=$var_images" >> $GITHUB_ENV
                  echo "tag=$var_tag" >> $GITHUB_ENV
                  echo "docker_tag=$var_docker_tag" >> $GITHUB_ENV

            - name: (node) Check Data
              id: check_data
              shell: bash
              run: |
                  echo "matrix.dist: ${{matrix.dist}}"
                  echo
                  echo "env.build_arch: ${{ env.build_arch }}"
                  echo "env.tag: ${{ env.tag }}"
                  echo "env.docker_tag: ${{env.docker_tag}}"
                  echo "env.docker_org: ${{env.docker_org}}"
                  echo "docker_tag_rc: ${{ env.docker_tag_rc }}"
                  echo "env.docker_images: ${{env.docker_images}}"
                  echo
                  echo "node_tag: ${{inputs.node_tag}}"
                  echo "node_docker_tag: ${{inputs.node_docker_tag}}"
                  echo "signer_tag: ${{inputs.signer_tag}}"
                  echo "signer_docker_tag: ${{inputs.signer_docker_tag}}"
                  # echo "is_node_release: ${{inputs.is_node_release}}"
                  # echo "is_signer_release: ${{inputs.is_signer_release}}"
                  echo "release_type: ${{inputs.release_type}}"
                  echo
                  echo "Artifact pattern: ${{ env.tag }}-binary-build-linux-${{ env.build_arch }}*"
                  echo

            ## Setup Docker for the builds
            - name: Docker setup
              id: docker_setup
              uses: stacks-network/actions/docker@main
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            ## Set docker metatdata
            - name: Docker Metadata ( ${{matrix.dist}} )
              id: docker_metadata
              uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 #v5.6.1
              with:
                  images: |
                      ${{env.docker_images}}
                  tags: |
                      type=raw,value=${{ env.BRANCH_NAME }}
                      type=ref,event=pr

            ## Build docker image for node release
            - name: Show vals ( ${{matrix.dist}} )
              id: show_vals
              shell: bash
              run: |
                  echo "platforms: ${{ env.docker_platforms }}"
                  echo "labels: ${{ steps.docker_metadata.outputs.labels }}"
                  echo "docker_tag: ${{ env.docker_tag }}"
                  echo "tag: ${{ env.tag }}"
                  echo
                  echo "build args:"
                  echo "    TAG=$${{ steps.docker_metadata.outputs.tags }}"
                  echo "    REPO=${{ github.repository_owner }}/${{ github.event.repository.name }}"
                  echo "    STACKS_NODE_VERSION=${{ env.tag || env.GITHUB_SHA_SHORT }}"
                  echo "    GIT_BRANCH=${{ env.GITHUB_REF_SHORT }}"
                  echo "    GIT_COMMIT=${{ env.GITHUB_SHA_SHORT }}"
                  echo "push: ${{ env.DOCKER_PUSH }}"

