## Github workflow to create reusable caches

name: TEST Release workflow

on:
  push:
    branches:
      - fix/release_workflow
  workflow_dispatch:
  pull_request:

concurrency:
  group: github-release-${{ github.head_ref || github.ref }}
  ## Always cancel duplicate jobs
  cancel-in-progress: true

run-name: test release build matrix

env:
    TARGET_CPU: ""
    LINKER: ""
    # set a default command to build
    CMD: "cargo build --features monitoring_prom,slog_json --profile release-lite --workspace"

jobs:
  ## Build arch dependent binaries from source
  ##
  ## Runs when the following is true:
  ##  - either node or signer tag is provided
  build-binaries:
    name: Build Binaries
    strategy:
      ## Run a maximum of 10 builds concurrently, using the matrix defined in inputs.arch
      max-parallel: 10
      matrix:
        arch:
          - linux-musl
          - linux-glibc
          - macos
          - windows
        cpu:
          - arm64
          - x86-64 ## defaults to x86-64-v3 variant - intel haswell (2013) and newer
          # - x86-64-v2 ## intel nehalem (2008) and newer
          # - x86-64-v3 ## intel haswell (2013) and newer
          # - x86-64-v4 ## intel skylake (2017) and newer
        os:
            - ubuntu-latest
            - macos-latest-large # this is a paid runner apparently
        exclude:
        ############################################
        # exclude linux-musl on macos
          - arch: linux-musl
            os: macos-latest-large
        # exclude linux-glibc on macos
          - arch: linux-glibc
            os: macos-latest-large
        ############################################
        # excludes macos on ubuntu
          - arch: macos
            os: ubuntu-latest
        # excludes windows on macos
          - arch: windows
            os: macos-latest-large
        # excludes windows-arm64
          - arch: windows
            cpu: arm64
        # excludes macos-x64
          - arch: macos
            cpu: x86-64
        ##  added for testing
        # excludes macos-arm64
          - arch: macos
            cpu: arm64
    # runs-on: ${{ matrix.os }}
    runs-on: ubuntu-latest
    steps:
      ## Set target env var based on the type of arch build
      - name: Set Target Platform
        id: set_target_platform
        shell: bash
        run: |
          case ${{ matrix.cpu }} in
            "x86-64")
              TARGET_CPU="${{ matrix.cpu }}-v3"
              case ${{ matrix.arch }} in
                "linux-musl")
                  TARGET="x86_64-unknown-linux-musl"
                  ;;
                "linux-glibc")
                  TARGET="x86_64-unknown-linux-gnu"
                  ;;
                "windows")
                  TARGET="x86_64-pc-windows-gnu"
                  ;;
                "*")
                  ;;
              esac
              ;;
            "arm64")
              case ${{ matrix.arch }} in
                "linux-musl")
                  TARGET="aarch64-unknown-linux-musl"
                  ;;
                "linux-glibc")
                  TARGET="aarch64-unknown-linux-gnu"
                  ;;
                "macos")
                  TARGET="aarch64-apple-darwin"
                  ;;
                "*")
                  ;;
              esac
              ;;
            "*")
              ;;
          esac
          if [[ -z "$TARGET" ]]; then
            echo "TARGET Variable is empty";
            exit 1
          fi
          echo "setting TARGET:${TARGET}"
          echo "setting TARGET_CPU: ${TARGET_CPU}"
          echo "TARGET=${TARGET}" >> "$GITHUB_ENV"
          echo "TARGET_CPU=${TARGET_CPU}" >> "$GITHUB_ENV"

      # ## cleanup runner
      # - name: Cleanup Runner
      #   id: runner_cleanup
      #   uses: stacks-network/actions/cleanup/disk@main

      ## Checkout the code
      - name: Checkout the latest code
        id: git_checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      ## Install rust toolchain (llvm-tools-preview)
      - name: Setup Rust Toolchain
        id: setup_rust_toolchain
        uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1
        with:
          toolchain: stable
          cache: false
          target: ${{ env.TARGET }}

      - name: Setup Musl Cross
        if: |
          env.TARGET == 'aarch64-unknown-linux-musl'
        id: musl_cross
        shell: bash
        run: |
          curl -LSf -# https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/aarch64-linux-musl-cross.tgz | tar zxf - -C /tmp

      ## echo what we're doing
      - name: Build Release ${{env.TARGET}}
        id: build_release
        shell: bash
        run: |
          echo "arch: ${{ matrix.arch }}"
          echo "cpu: ${{ matrix.cpu }}"
          echo "os: ${{ matrix.os }}"
          echo "TARGET: ${{env.TARGET}}"
          echo "TARGET_CPU: ${{env.TARGET_CPU}}"
          echo "LINKER: ${{env.LINKER}}"
          echo "CMD: ${{env.CMD}}"

          case "${{env.TARGET}}" in
            # linux glibc aarch64
            "aarch64-unknown-linux-gnu") # linux-glibc-arm64
              sudo apt-get install -y git gcc-aarch64-linux-gnu libclang-dev llvm
              LINKER=aarch64-linux-gnu-gcc
              # cargo build --features monitoring_prom,slog_json --profile release-lite --workspace --target $TARGET --config "target.${TARGET}.linker=\"${LINKER}\""
              ${{env.CMD}} --target $TARGET --config "target.${{env.TARGET}}.linker=\"${LINKER}\""
              ;;
            # linux glibc x64
            "x86_64-unknown-linux-gnu") # linux-glibc-x86_64
              sudo apt-get install -y git libclang-dev llvm
              # cargo build --features monitoring_prom,slog_json --profile release-lite --workspace --target $TARGET --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\""
              ${{env.CMD}} --target $TARGET --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\""
              ;;
            # windows glibc x64
            "x86_64-pc-windows-gnu") # windows-x86_64
              sudo apt-get install -y git gcc-mingw-w64-x86-64
              LINKER=x86_64-w64-mingw32-gcc
              # cargo build --features monitoring_prom,slog_json --profile release-lite --workspace --target $TARGET --config "target.${TARGET}.linker=\"${LINKER}\"" --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\""
              ${{env.CMD}} --target $TARGET --config "target.${{env.TARGET}}.linker=\"${LINKER}\"" --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\""
              ;;
            # linux musl x64
            "x86_64-unknown-linux-musl") # linux-musl-x86_64
              sudo apt-get install musl-tools
              # cargo build --features monitoring_prom,slog_json --profile release-lite --workspace --target $TARGET --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\""
              ${{env.CMD}} --target $TARGET --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\""
              ;;
            # linux musl aarch64
            "aarch64-unknown-linux-musl") # linux-musl-arm64
              sudo apt-get install -y gcc-aarch64-linux-gnu musl-dev
              LINKER=/tmp/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc
              # cargo build --features monitoring_prom,slog_json --profile release-lite --workspace --target $TARGET --config "target.${TARGET}.linker=\"${LINKER}\""
              ${{env.CMD}} --target $TARGET --config "target.${{env.TARGET}}.linker=\"${LINKER}\""
              ;;
            # macos aarch64
            "aarch64-apple-darwin") # macos-arm64
              ${{env.CMD}} --config build.rustflags="\"-C target-cpu=native\""
              ;;
            # catchall - run default command
            "*")
              echo "Target: $TARGET"
              echo "no match for build target. using defaults"
              ${{env.CMD}}
              ;;
          esac
          exit 0

      ## echo what we're doing
      - name: Show Release
        id: show_release
        shell: bash
        run: |
          printenv
          ls -al
          ls -al ./release
          ls -al ./release/*
          ls -al ./release/${{env.TARGET}}
          ls -al ./release/${{env.TARGET}}/release-list

      # ## Compress the binary artifact
      # - name: Compress artifact
      #   id: compress_artifact
      #   shell: bash
      #   run: |
      #     zip --junk-paths ${{ env.ZIPFILE }} ./release/${{ inputs.arch }}/*

      # ## Upload the binary artifact to the github action (used in `github-release.yml` to create a release)
      # - name: Upload artifact
      #   id: upload_artifact
      #   uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
      #   with:
      #     name: ${{ inputs.node_tag || inputs.signer_docker_tag }}-binary-build-${{ env.ZIPFILE }}
      #     path: ${{ env.ZIPFILE }}.zip


