## Github workflow to create reusable caches

name: Build Release Binaries

on:
    workflow_call:
        inputs:
            node_tag:
                description: "Node Release Tag"
                required: true
                type: string
            signer_tag:
                description: "Signer Release Tag"
                required: true
                type: string

concurrency:
    group: release-build-${{ github.head_ref || github.ref }}
    ## Always cancel duplicate jobs
    cancel-in-progress: true

run-name: test release build matrix

env:
    # set a default command to build. we'll define specific build config options later per arch.
    CMD: "cargo build --features monitoring_prom,slog_json --profile release-lite --workspace"
    # ensure these env vars have no values since they will be explicitly set later
    TARGET_CPU: ""
    LINKER: ""
jobs:
    build-binaries:
        name: Build Binaries
        runs-on: ${{ matrix.os }}
        permissions:
            id-token: write
            attestations: write
        strategy:
            ## Run a maximum of 10 builds concurrently, using the matrix defined in inputs.arch
            max-parallel: 10
            matrix:
                arch:
                    - linux-glibc
                    - linux-musl
                    # - macos
                    - windows
                cpu:
                    - x86-64
                    - arm64
                os:
                    - ubuntu-latest
                    # - macos-latest-large # this is a paid runner
                exclude:
                    ############################################
                    # exclude linux-musl on macos
                    - arch: linux-musl
                      os: macos-latest-large
                    # exclude linux-glibc on macos
                    - arch: linux-glibc
                      os: macos-latest-large
                    ############################################
                    # excludes macos on ubuntu
                    - arch: macos
                      os: ubuntu-latest
                    # excludes windows on macos
                    - arch: windows
                      os: macos-latest-large
                    # excludes windows-arm64
                    - arch: windows
                      cpu: arm64
                    # excludes macos-x64
                    - arch: macos
                      cpu: x86-64
                    ##
                    ##  REMOVE FOR PR - this build needs to happen
                    ## excludes macos-arm64
                    - arch: macos
                      cpu: arm64
                    ##
        steps:
            ## Checkout the code
            - name: Checkout the latest code
              id: git_checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  ref: ${{ github.ref }}

            ## Set target env var based on the type of arch build
            - name: Configure Target Platform
              id: configure_target_platform
              shell: bash
              run: |
                  case ${{ matrix.cpu }} in
                    x86-64*)
                      # TARGET_CPU="${{ matrix.cpu }}-v3"
                      ARCHIVE_NAME="$(echo "${{matrix.cpu}}" | sed -e 's|86-||g')" # if matrix.cpu ever changes to a different x86 version, this will set the archive naming appropriately.
                      case ${{ matrix.cpu }} in
                        x86-64)
                          TARGET_CPU="${{ matrix.cpu }}-v3" # default to x86-64-v3 if generic x86-64 is used for the build
                          ;;
                        *)
                          TARGET_CPU="${{ matrix.cpu }}" # if matrix.cpu is specifically v3/v4, we should target that
                          ;;
                      esac

                      case ${{ matrix.arch }} in
                        linux-musl)
                          # install dependencies for linux x64 musl and set target
                          sudo apt-get update && sudo apt-get install -y musl-tools || exit 1
                          TARGET="x86_64-unknown-linux-musl"
                          ;;
                        linux-glibc)
                          # install dependencies for linux x64 glibc and set target
                          sudo apt-get update && sudo apt-get install -y git libclang-dev llvm || exit 1
                          TARGET="x86_64-unknown-linux-gnu"
                          ;;
                        windows)
                          # install dependencies for windos x64 glibc and set target
                          sudo apt-get update && sudo apt-get install -y git gcc-mingw-w64-x86-64 || exit 1
                          TARGET="x86_64-pc-windows-gnu"
                          ;;
                        *)
                          ;;
                      esac
                      ;;
                    arm64)
                      ARCHIVE_NAME=${{matrix.cpu}}
                      case ${{ matrix.arch }} in
                        linux-musl)
                          # install dependencies for linux aarch64 musl and set target
                          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu musl-dev || exit 1
                          curl -LSf -# https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/aarch64-linux-musl-cross.tgz | tar zxf - -C /tmp || exit 1
                          TARGET="aarch64-unknown-linux-musl"
                          ;;
                        linux-glibc)
                          # install dependencies for linux aarch64 glibc and set target
                          sudo apt-get update && sudo apt-get install -y git gcc-aarch64-linux-gnu libclang-dev llvm || exit 1
                          TARGET="aarch64-unknown-linux-gnu"
                          ;;
                        macos)
                          TARGET="aarch64-apple-darwin"
                          ;;
                        *)
                          ;;
                      esac
                      ;;
                    *)
                      ;;
                  esac
                  if [[ -z "$TARGET" ]]; then
                    echo "[ERROR] TARGET Variable is empty for ${{ matrix.arch }}-${{ matrix.cpu }}";
                    exit 1
                  fi
                  echo "setting TARGET:${TARGET}"
                  echo "setting TARGET_CPU: ${TARGET_CPU}"
                  echo "setting ZIPFILE_NAME: ${{ matrix.arch }}-${ARCHIVE_NAME}"
                  echo "TARGET=${TARGET}" >> "$GITHUB_ENV"
                  echo "TARGET_CPU=${TARGET_CPU}" >> "$GITHUB_ENV"
                  # echo "ZIPFILE_NAME=${{github.sha}}-${{matrix.arch}}-${ARCHIVE_NAME}" >> "$GITHUB_ENV"
                  echo "ZIPFILE_NAME=${{matrix.arch}}-${ARCHIVE_NAME}" >> "$GITHUB_ENV"

            ## Install rust toolchain (llvm-tools-preview)
            - name: Setup Rust Toolchain
              id: setup_rust_toolchain
              uses: actions-rust-lang/setup-rust-toolchain@11df97af8e8102fd60b60a77dfbf58d40cd843b8 # v1.10.1
              with:
                  toolchain: stable
                  cache: false
                  target: ${{ env.TARGET }}

            ## Install llvm-tools-preview
            - name: show vals
              id: show_vals
              shell: bash
              run: |
                  echo "github.sha=${{github.sha}}"
                  echo "ZIPFILE_NAME=${{env.ZIPFILE_NAME}}"

            ## Build the release binaries
            - name: Build Release
              id: build_release
              shell: bash
              run: |
                  BINS=""
                  if [ "${{ inputs.node_tag }}" == '' ]; then
                    BINS="--bin stacks-signer"
                  fi
                  echo "BINS: ${BINS}"
                  case "${{env.TARGET}}" in
                    # linux glibc aarch64
                    aarch64-unknown-linux-gnu) # linux-glibc-arm64
                      LINKER=aarch64-linux-gnu-gcc
                      echo "Running: ${CMD} ${BINS} --target $TARGET --config \"target.${TARGET}.linker=\\\"${LINKER}\\\"\" "
                      ${{env.CMD}} ${BINS} --target $TARGET --config "target.${{env.TARGET}}.linker=\"${LINKER}\"" || exit 1
                      ;;
                    # linux glibc x64
                    x86_64-unknown-linux-gnu) # linux-glibc-x86_64
                      echo "Running: ${CMD} ${BINS} --target $TARGET --config build.rustflags=\"\\\"-C target-cpu=${TARGET_CPU}\\\"\" "
                      ${{env.CMD}} ${BINS} --target $TARGET --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\"" || exit 1
                      ;;
                    # windows glibc x64
                    x86_64-pc-windows-gnu) # windows-x86_64
                      LINKER=x86_64-w64-mingw32-gcc
                      echo "Running: ${CMD} ${BINS} --target $TARGET --config \"target.${TARGET}.linker=\\\"${LINKER}\\\"\"  --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\"" "
                      ${{env.CMD}} ${BINS} --target $TARGET --config "target.${{env.TARGET}}.linker=\"${LINKER}\"" --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\"" || exit 1
                      ;;
                    # linux musl x64
                    x86_64-unknown-linux-musl) # linux-musl-x86_64
                      echo "Running: ${CMD} ${BINS} --target $TARGET --config build.rustflags=\"\\\"-C target-cpu=${TARGET_CPU}\\\"\" "
                      ${{env.CMD}} ${BINS} --target $TARGET --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\"" || exit 1
                      ;;
                    # linux musl aarch64
                    aarch64-unknown-linux-musl) # linux-musl-arm64
                      LINKER=/tmp/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc
                      echo "Running: ${CMD} ${BINS} --target $TARGET --config \"target.${TARGET}.linker=\\\"${LINKER}\\\"\" "
                      ${{env.CMD}} ${BINS} --target $TARGET --config "target.${{env.TARGET}}.linker=\"${LINKER}\"" || exit 1
                      ;;
                    # macos aarch64
                    aarch64-apple-darwin) # macos-arm64
                      TARGET_CPU=native
                      echo "Running: ${CMD} ${BINS}--target $TARGET --config build.rustflags=\"\\\"-C target-cpu=${TARGET_CPU}\\\"\" "
                      ${{env.CMD}} ${BINS} --target $TARGET --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\"" || exit 1
                      ;;
                    # catchall - run the default command
                    *)
                      echo "No matrix match for build target ($TARGET). using defaults"
                      ${{env.CMD}} ${BINS} || exit 1
                      ;;
                  esac
                  exit 0


            ## Compress the binary artifact
            - name: Compress binaries (stacks-node)
              if: |
                inputs.node_tag != ''
              id: compress_artifacts_stacks_node
              shell: bash
              run: |
                  file -0 ./target/${{env.TARGET}}/release-lite/* | sed -nE 's/\x0:\s*(ELF|PE32+|Mach).*//p' | zip --junk-paths ${{env.ZIPFILE_NAME}}.zip -@

            ## Upload the binary artifact to the github action (used in `github-release.yml` to create a release)
            - name: Upload Artifact (stacks-node)
              if: |
                inputs.node_tag != ''
              id: upload_artifact_stacks_node
              uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
              with:
                  name: ${{github.sha}}-stacks-node-${{ env.ZIPFILE_NAME }}
                  path: ${{ env.ZIPFILE_NAME }}.zip

            ## Attest the release binaries
            - name: Attest Release Artifact (stacks-node)
              if: |
                inputs.node_tag != ''
              id: attest_artifact_stacks_node
              uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
              with:
                  subject-path: ${{ env.ZIPFILE_NAME }}.zip

            ## Second set of steps for the signer only if the release type is stacks-node
            ## Compress the binary artifact
            - name: Compress binaries (stacks-signer)
              if: |
                inputs.signer_tag != ''
              id: compress_artifacts_stacks_signer
              shell: bash
              run: |
                # remove the stacks-node zipfile and recreate for the signer
                [ -e "${{env.ZIPFILE_NAME}}.zip" ] && rm -f "${{env.ZIPFILE_NAME}}.zip"
                file -0 ./target/${{env.TARGET}}/release-lite/stacks-signer* | sed -nE 's/\x0:\s*(ELF|PE32+|Mach).*//p' | zip --junk-paths ${{env.ZIPFILE_NAME}}.zip -@

            ## Upload the binary artifact to the github action (used in `github-release.yml` to create a release)
            - name: Upload Artifact (stacks-signer)
              if: |
                inputs.signer_tag != ''
              id: upload_artifact_stacks_signer
              uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
              with:
                  name: ${{github.sha}}-stacks-signer-${{ env.ZIPFILE_NAME }}
                  path: ${{ env.ZIPFILE_NAME }}.zip

            ## Attest the release binaries
            - name: Attest Release Artifact (stacks-signer)
              if: |
                inputs.signer_tag != ''
              id: attest_artifact_stacks_signer
              uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
              with:
                  subject-path: ${{ env.ZIPFILE_NAME }}.zip
