          #     ##
          #     ;;
          #   # macos aarch64
          #   aarch64-apple-darwin) # macos-arm64
          #     TARGET_CPU=native
          #     echo "$CMD --target $TARGET --config build.rustflags=\"\\\"-C target-cpu=${TARGET_CPU}\\\"\" "
          #     ${{env.CMD}} --target $TARGET --config build.rustflags="\"-C target-cpu=${TARGET_CPU}\"" || exit 1
