## Github workflow to create reusable caches

name: Docker Release Images

on:
    workflow_call:
        inputs:
            node_tag:
                description: "Node Release Tag"
                required: true
                type: string
            node_docker_tag:
                description: "Node Docker Release Tag"
                required: true
                type: string
            signer_tag:
                description: "Signer Release Tag"
                required: true
                type: string
            signer_docker_tag:
                description: "Signer Docker Release Tag"
                required: true
                type: string
            is_node_release:
                description: "True if it is a node release"
                required: true
                type: string
            is_signer_release:
                description: "True if it is a signer release"
                required: true
                type: string
concurrency:
    group: release-docker-${{ github.head_ref || github.ref }}
    ## Always cancel duplicate jobs
    cancel-in-progress: true

run-name: TEST docker release images

env:
    platforms: "linux/arm64, linux/amd64"
jobs:
    # move this to build-release or github-release and pass data as inputs here
    set-vars:
        name: Set Vars
        runs-on: ubuntu-latest
        outputs:
            docker_org: ${{ steps.set_docker_org.outputs.docker_org }}
            is-signer-release: ${{ steps.check_signer_release.outputs.is-signer-release }}
            docker_tag_rc: ${{ steps.docker_tag_rc_flag.outputs.docker_tag_rc }}
        steps:
            ## if the repo owner is not `stacks-network`, default to a docker_org of the repo owner (i.e. github user id)
            ## this allows forks to run the docker push workflows without having to hardcode a dockerhub org (but it does require docker hub user to match github username)
            ## Checkout the code
            - name: Checkout the latest code
              id: git_checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Set Docker Org
              id: set_docker_org
              shell: bash
              run: |
                  if [[ "${{ github.repository_owner }}" != "stacks-network" ]]; then
                    echo "docker_org=${{ github.repository_owner }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "docker_org=blockstack" >> "$GITHUB_OUTPUT"
                  fi

            - name: Check Signer Release
              id: check_signer_release
              shell: bash
              run: |
                  #
                  # inputs.tag from composite is either node_tag or signer_tag, which is used in the build args for the image
                  #
                  case "${{ inputs.tag }}" in
                    signer-*)
                      echo "is-signer-release=true" >> $GITHUB_OUTPUT
                      ;;
                    *)
                      echo "is-signer-release=false" >> $GITHUB_OUTPUT
                      ;;
                  esac

            - name: Set Docker Tag RC Flag
              id: docker_tag_rc_flag
              shell: bash
              run: |
                  if [[ "${{ inputs.docker_tag }}" =~ -rc[0-9]*$ ]]; then
                    echo "docker_tag_rc=true" >> $GITHUB_ENV
                  else
                    echo "docker_tag_rc=false" >> $GITHUB_ENV
                  fi

            - name: Output
              id: output
              shell: bash
              run: |
                  echo "is-signer-release: ${{ env.is-signer-release }}"
                  echo "node_docker_tag: ${{ inputs.node_docker_tag }}"
                  echo "node_tag: ${{ inputs.node_tag }}"
    stacks-node:
        if: |
            needs.set-vars.outputs.is-signer-release == 'false' &&
            inputs.node_docker_tag != ''
        # if: |
        #     inputs.node_tag != ''
        name: Docker Image (stacks-node)
        runs-on: ubuntu-latest
        needs:
            - set-vars
        env:
            docker_org: ${{ needs.set-vars.outputs.docker_org }}
            docker_tag_rc: ${{ needs.set-vars.outputs.docker_tag_rc }}
            docker_tag: ${{ inputs.node_docker_tag }}
            is-signer-release: ${{ needs.set-vars.outputs.is-signer-release }}
            tag: ${{ inputs.node_tag }}
        environment: "Push to Docker"
        permissions:
            id-token: write
            attestations: write
        strategy:
            fail-fast: false
            ## Build a maximum of 2 images concurrently based on matrix.dist
            max-parallel: 2
            matrix:
                dist:
                    - alpine
                    - debian
        steps:
            ## set env var for which artifacts to download
            - name: Set Artifact Arch
              id: set_artifact_arch
              shell: bash
              run: |
                  if [[ "${{ matrix.dist }}" == "alpine" ]]; then
                    echo "build_arch=musl" >> "$GITHUB_ENV"
                  else
                    echo "build_arch=glibc" >> "$GITHUB_ENV"
                  fi

            # ## Checkout the code
            # - name: Checkout the latest code
            #   id: git_checkout
            #   uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Download Artifacts
              id: download_artifacts
              uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
              with:
                  # pattern: binaries-*
                  pattern: ${{ env.tag }}-binary-build-linux-${{ env.build_arch }}*
                  path: /tmp/release
                  merge-multiple: true

            - name: Check Data
              id: check_data
              shell: bash
              run: |
                  echo "pwd:"
                  pwd
                  echo "checking release dir:"
                  ls -al /tmp/release
                  unzip -l /tmp/release/linux-glibc-x64.zip
                  echo "tag: ${{ env.tag}}"
                  echo "docker_tag: ${{ env.docker_tag }}"
                  echo "docker_tag_rc: ${{ env.docker_tag_rc }}"
                  echo "docker_org: ${{ env.docker_org }}"

            ## Setup Docker for the builds
            ##
            ## note: we can disable the vm cleanup for this. at a minimum, we can use /mnt for ops
            ##
            ## Setup Docker for the builds
            - name: Docker setup
              id: docker_setup
              uses: stacks-network/actions/docker@main
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Docker Metadata ( ${{matrix.dist}} )
              id: docker_metadata
              uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 #v5.6.1
              with:
                  ## tag images with current repo name `stacks-core` as well as legacy `stacks-blockchain`
                  images: |
                      ${{env.docker_org}}/${{ github.event.repository.name }}
                      ${{env.docker_org}}/stacks-blockchain
                  tags: |
                      type=raw,value=latest,enable=${{ env.docker_tag != '' && env.docker_tag_rc != 'true' && matrix.dist == 'debian' }}
                      type=raw,value=${{ env.docker_tag }}-${{ matrix.dist }},enable=${{ env.docker_tag != '' && matrix.dist == 'debian'}}
                      type=raw,value=${{ env.docker_tag }},enable=${{ env.docker_tag != '' && matrix.dist == 'debian' }}
                      type=ref,event=tag,enable=${{ matrix.dist == 'debian' }}
                      type=raw,value=latest-${{ matrix.dist }},enable=${{ env.docker_tag != '' && env.docker_tag_rc != 'true' && matrix.dist == 'alpine' }}
                      type=raw,value=${{ env.docker_tag }}-${{ matrix.dist }},enable=${{ env.docker_tag != '' && matrix.dist == 'alpine' }}

            ## Build docker image for node release
            - name: Show vals ( ${{matrix.dist}} )
              if: ${{ env.is-signer-release == 'false' }}
              id: show_vals
              shell: bash
              run: |
                  echo "platforms: ${{ env.platforms }}"
                  echo "labels: ${{ steps.docker_metadata.outputs.labels }}"
                  echo "docker_tag: ${{ env.docker_tag }}"
                  echo "tag: ${{ env.tag }}"
                  echo
                  echo "build args:"
                  echo "    TAG=$${{ steps.docker_metadata.outputs.tags }}"
                  echo "    REPO=${{ github.repository_owner }}/${{ github.event.repository.name }}"
                  echo "    STACKS_NODE_VERSION=${{ env.tag || env.GITHUB_SHA_SHORT }}"
                  echo "    GIT_BRANCH=${{ env.GITHUB_REF_SHORT }}"
                  echo "    GIT_COMMIT=${{ env.GITHUB_SHA_SHORT }}"
                  echo "push: ${{ env.DOCKER_PUSH }}"

            - name: Build and Push ( ${{matrix.dist}} )
              if: ${{ env.is-signer-release == 'false' }}
              id: docker_build_node
              uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
              with:
                  context: /tmp
                  file: ./.github/actions/dockerfiles/Dockerfile.${{ matrix.dist }}-binary
                  platforms: ${{ env.platforms }}
                  tags: ${{ steps.docker_metadata.outputs.tags }}
                  labels: ${{ steps.docker_metadata.outputs.labels }}
                  build-args: |
                      TAG=${{ steps.docker_metadata.outputs.tags }}
                      REPO=${{ github.repository_owner }}/${{ github.event.repository.name }}
                      STACKS_NODE_VERSION=${{ env.tag || env.GITHUB_SHA_SHORT }}
                      GIT_BRANCH=${{ env.GITHUB_REF_SHORT }}
                      GIT_COMMIT=${{ env.GITHUB_SHA_SHORT }}
                  push: ${{ env.DOCKER_PUSH }}

    # stacks-signer:
    #     if: |
    #         needs.set-vars.outputs.is-signer-release == 'true' ||
    #         inputs.node_docker_tag != ''
