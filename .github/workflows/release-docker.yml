## Github workflow to create reusable caches
## https://github.com/wileyj/stacks-core/blob/e5385d6484cebcfabe03070f7a6c729a088e841d/.github/workflows/release-docker.yml
#
name: Docker Release Images

on:
    workflow_call:
        inputs:
            node_tag:
                description: "Node Release Tag"
                required: true
                type: string
            node_docker_tag:
                description: "Node Docker Release Tag"
                required: true
                type: string
            signer_tag:
                description: "Signer Release Tag"
                required: true
                type: string
            signer_docker_tag:
                description: "Signer Docker Release Tag"
                required: true
                type: string
            release_type:
                description: "Release type (one of stacks-node, stacks-signer"
                required: true
                type: string
concurrency:
    group: ${{ inputs.release_type }}-${{ github.head_ref || github.ref }}
    ## Always cancel duplicate jobs
    cancel-in-progress: true

run-name: TEST docker release images

env:
    platforms: "linux/arm64, linux/amd64"
jobs:
    release-images:
        if: |
            ( inputs.release_type == 'stacks-node' || inputs.releast_type == 'stacks-signer') &&
            ( inputs.signer_tag != '' || inputs.node_tag != '' )
        name: Docker Image (${{inputs.release_type}}, ${{matrix.dist}})
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            attestations: write
        strategy:
            fail-fast: false
            ## Build a maximum of 2 images concurrently based on matrix.dist
            max-parallel: 2
            matrix:
                dist:
                    - alpine
                    - debian
        steps:
            - name: Set Docker Org
              id: set_docker_org
              shell: bash
              run: |
                  if [[ "${{ github.repository_owner }}" != "stacks-network" ]]; then
                    var_org="${{ github.repository_owner }}"
                  else
                    var_org="blockstack"
                  fi
                  echo "docker_org=$var_org"
                  echo "docker_org=$var_org" >> $GITHUB_ENV

            - name: Set Local Vars
              id: set_vars
              shell: bash
              run: |
                  if [ "${{ inputs.release_type }}" == "stacks-signer" ]; then
                    # stacks-signer
                    var_images="${{ env.docker_org }}/stacks-signer"
                    var_tag="${{ inputs.signer_tag }}"
                    var_docker_tag=${{ inputs.signer_docker_tag }}
                  else
                    # stacks-node
                    var_images="${{ env.docker_org }}/${{ github.event.repository.name }} ${{ env.docker_org }}/stacks-blockchain"
                    var_tag="${{ inputs.node_tag }}"
                    var_docker_tag=${{ inputs.node_docker_tag }}
                  fi

                  echo
                  echo "var_images: $var_images"
                  echo "inputs.release_type: ${{inputs.release_type}}"
                  echo "var_tag: $var_tag"
                  echo "var_docker_tag: $var_docker_tag"
                  echo
                  echo "docker_images=$var_images" >> $GITHUB_ENV
                  echo "tag=$var_tag" >> $GITHUB_ENV
                  echo "docker_tag=$var_docker_tag" >> $GITHUB_ENV

            - name: Set Docker Tag RC Flag
              id: docker_tag_rc_flag
              shell: bash
              run: |
                  var_docker_tag_rc=false
                  if [[ "$docker_tag" =~ -rc[0-9]*$ ]]; then
                    # is a release candidate
                    var_docker_tag_rc=true
                  fi
                  echo "var_docker_tag_rc: $var_docker_tag_rc"
                  echo "docker_tag_rc=$var_docker_tag_rc" >> "$GITHUB_ENV"

            # - name: Set Docker Image(s) list
            #   id: docker_images
            #   shell: bash
            #   run: |
            #       if [ "${{ inputs.release_type }}" != "stacks-signer" ]; then
            #         images="${{ env.docker_org }}/${{ github.event.repository.name }} ${{ env.docker_org }}/stacks-blockchain"
            #       else
            #         images="${{ env.docker_org }}/stacks-signer"
            #       fi
            #       echo "docker_images=$images" >> $GITHUB_ENV
            #       echo "images: $images"
            #       echo "inputs.release_type: ${{inputs.release_type}}"

            ## set env var for which artifacts to download
            - name: Set Artifact Arch
              id: set_artifact_arch
              shell: bash
              run: |
                  if [ "${{ matrix.dist }}" == "alpine" ]; then
                    var_build_arch=musl
                  else
                    var_build_arch=glibc
                  fi
                  echo "var_build_arch: $var_build_arch"
                  echo "build_arch=$var_build_arch" >> "$GITHUB_ENV"

            - name: (node) Check Data
              id: check_data
              shell: bash
              run: |
                  echo "matrix.dist: ${{matrix.dist}}"
                  echo
                  echo "env.build_arch: ${{ env.build_arch }}"
                  echo "env.tag: ${{ env.tag }}"
                  echo "env.docker_tag: ${{env.docker_tag}}"
                  echo "env.docker_org: ${{env.docker_org}}"
                  echo "docker_tag_rc: ${{ env.docker_tag_rc }}"
                  echo "env.docker_images: ${{env.docker_images}}"
                  echo
                  echo "node_tag: ${{inputs.node_tag}}"
                  echo "node_docker_tag: ${{inputs.node_docker_tag}}"
                  echo "signer_tag: ${{inputs.signer_tag}}"
                  echo "signer_docker_tag: ${{inputs.signer_docker_tag}}"
                  # echo "is_node_release: ${{inputs.is_node_release}}"
                  # echo "is_signer_release: ${{inputs.is_signer_release}}"
                  echo "release_type: ${{inputs.release_type}}"
                  echo
                  echo "Artifact pattern: ${{ env.tag }}-binary-build-linux-${{ env.build_arch }}*"
                  echo

              # # ## Checkout the code
              # # - name: Checkout the latest code
              # #   id: git_checkout
              # #   uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            # - name: Download Artifacts
            #   id: download_artifacts
            #   uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
            #   with:
            #       # pattern: binaries-*
            #       pattern: ${{ env.tag }}-binary-build-linux-${{ env.build_arch }}*
            #       path: /tmp/release
            #       merge-multiple: true

            # - name: Check Data
            #   id: check_data
            #   shell: bash
            #   run: |
            #       echo "pwd:"
            #       pwd
            #       echo "checking release dir:"
            #       ls -al /tmp/release

            ## Setup Docker for the builds
            ##
            ## note: we can disable the vm cleanup for this. at a minimum, we can use /mnt for ops
            ##
            # Setup Docker for the builds
            - name: Docker setup
              id: docker_setup
              uses: stacks-network/actions/docker@main
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}

            - name: Docker Metadata ( ${{matrix.dist}} )
              id: docker_metadata
              uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 #v5.6.1
              with:
                  # tag images with current repo name `stacks-core` as well as legacy `stacks-blockchain`
                  images: |
                      ${{ env.docker_images }}
                  # images: |
                  #     ${{env.docker_org}}/${{ github.event.repository.name }} ${{env.docker_org}}/stacks-blockchain
                  tags: |
                      type=raw,value=latest,enable=${{ env.docker_tag != '' && env.docker_tag_rc != 'true' && matrix.dist == 'debian' }}
                      type=raw,value=${{ env.docker_tag }}-${{ matrix.dist }},enable=${{ env.docker_tag != '' && matrix.dist == 'debian'}}
                      type=raw,value=${{ env.docker_tag }},enable=${{ env.docker_tag != '' && matrix.dist == 'debian' }}
                      type=ref,event=tag,enable=${{ matrix.dist == 'debian' }}
                      type=raw,value=latest-${{ matrix.dist }},enable=${{ env.docker_tag != '' && env.docker_tag_rc != 'true' && matrix.dist == 'alpine' }}
                      type=raw,value=${{ env.docker_tag }}-${{ matrix.dist }},enable=${{ env.docker_tag != '' && matrix.dist == 'alpine' }}

            ## Build docker image for node release
            - name: Show vals ( ${{matrix.dist}} )
              id: show_vals
              shell: bash
              run: |
                  echo "platforms: ${{ env.platforms }}"
                  echo "labels: ${{ steps.docker_metadata.outputs.labels }}"
                  echo "docker_tag: ${{ env.docker_tag }}"
                  echo "tag: ${{ env.tag }}"
                  echo
                  echo "build args:"
                  echo "    TAG=$${{ steps.docker_metadata.outputs.tags }}"
                  echo "    REPO=${{ github.repository_owner }}/${{ github.event.repository.name }}"
                  echo "    STACKS_NODE_VERSION=${{ env.tag || env.GITHUB_SHA_SHORT }}"
                  echo "    GIT_BRANCH=${{ env.GITHUB_REF_SHORT }}"
                  echo "    GIT_COMMIT=${{ env.GITHUB_SHA_SHORT }}"
                  echo "push: ${{ env.DOCKER_PUSH }}"

            # - name: Build and Push ( ${{matrix.dist}} )
            #   id: docker_build
            #   uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
            #   with:
            #       context: /tmp
            #       file: ./.github/actions/dockerfiles/${{ matrix.dist }}/Dockerfile.release
            #       # file: ./.github/actions/dockerfiles/Dockerfile.${{ matrix.dist }}-binary
            #       platforms: ${{ env.platforms }}
