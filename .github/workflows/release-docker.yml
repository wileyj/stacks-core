## Github workflow to create release docker images

name: Docker Release Images

on:
    workflow_call:
        inputs:
            node_tag:
                description: "Node Release Tag"
                required: true
                type: string
            node_docker_tag:
                description: "Node Docker Release Tag"
                required: true
                type: string
            signer_tag:
                description: "Signer Release Tag"
                required: true
                type: string
            signer_docker_tag:
                description: "Signer Docker Release Tag"
                required: true
                type: string
            release_type:
                description: "Release type (one of stacks-core, stacks-signer"
                required: true
                type: string
concurrency:
    group: ${{ inputs.release_type }}-${{ github.head_ref || github.ref }}
    ## Always cancel duplicate jobs
    cancel-in-progress: true

run-name: ${{ inputs.node_tag || inputs.signer_tag }}

env:
    docker_platforms: "linux/arm64, linux/amd64"
    docker_registry: ghcr.io
    provenance: false
jobs:
    release-images:
        if: |
            ( inputs.release_type == 'stacks-core' || inputs.release_type == 'stacks-signer') &&
            ( inputs.signer_tag != '' || inputs.node_tag != '' )
        name: Docker Image (${{inputs.release_type}}, ${{matrix.dist}})
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            attestations: write
            packages: write
        strategy:
            fail-fast: false
            ## Build a maximum of 2 images concurrently based on matrix.dist
            max-parallel: 2
            matrix:
                dist:
                    - alpine # uncomment to build alpine images
                    - debian
        steps:
            - name: Set Docker Org
              id: set_docker_org
              shell: bash
              run: |
                  var_org="${{ github.repository_owner }}"
                  var_images="${{env.docker_registry}}/${{ github.repository }}"
                  var_push=${{ (github.actor != '') && (secrets.GITHUB_TOKEN != '') }}
                  echo "docker_org=$var_org" >> $GITHUB_ENV
                  echo "docker_images=$var_images" >> $GITHUB_ENV
                  # echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
                  # echo "DOCKER_PUSH=$var_push" >> $GITHUB_ENV

            - name: Set Local Vars
              id: set_vars
              shell: bash
              # setting image to release_type may be ok, since we don't need stacks-blockchain in ghcr (only in dockerhub mirror)
              run: |
                  var_default_image="${{env.docker_registry}}/${{ github.repository_owner }}/${{ inputs.release_type }}"
                  if [ "${{ inputs.release_type }}" == "stacks-signer" ]; then
                    # stacks-signer
                    var_images="${var_default_image}"
                    var_tag="${{ inputs.signer_tag }}"
                    var_docker_tag=${{ inputs.signer_docker_tag }}
                  else
                    # stacks-core
                    # var_images="${var_default_image} ${{env.docker_registry}}/${{ github.repository_owner }}/stacks-blockchain"
                    var_images="${var_default_image}"
                    var_tag="${{ inputs.node_tag }}"
                    var_docker_tag=${{ inputs.node_docker_tag }}
                  fi

                  echo
                  echo "var_images: ${var_images}"
                  echo "inputs.release_type: ${{inputs.release_type}}"
                  echo "var_tag: ${var_tag}"
                  echo "var_docker_tag: ${var_docker_tag}"
                  echo
                  echo "docker_images=${var_images}" >> $GITHUB_ENV
                  echo "tag=${var_tag}" >> $GITHUB_ENV
                  echo "docker_tag=${var_docker_tag}" >> $GITHUB_ENV

            - name: Set Docker Tag RC Flag
              id: docker_tag_rc_flag
              shell: bash
              run: |
                  var_docker_tag_rc=false
                  if [[ "${docker_tag}" =~ -rc[0-9]*$ ]]; then
                    # is a release candidate
                    var_docker_tag_rc=true
                  fi
                  echo "var_docker_tag_rc: ${var_docker_tag_rc}"
                  echo "docker_tag_rc=${var_docker_tag_rc}" >> "$GITHUB_ENV"

            ## set env var for which artifacts to download
            - name: Set Artifact Arch
              id: set_artifact_arch
              shell: bash
              run: |
                  if [ "${{ matrix.dist }}" == "alpine" ]; then
                    var_build_arch=musl
                  else
                    var_build_arch=glibc
                  fi
                  echo "var_build_arch: ${var_build_arch}"
                  echo "build_arch=${var_build_arch}" >> "$GITHUB_ENV"

            - name: Download Artifacts
              id: download_artifacts
              uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
              with:
                  # pattern: binaries-*
                  # 4.0.0.0.0-binary-build-linux-glibc*'
                  # pattern: ${{ inputs.node_tag }}-binary-build-linux-${{ env.build_arch }}*
                  pattern: ${{ inputs.node_tag || inputs.signer_tag }}-${{ env.build_arch }}* # this is more correct compared to above, since a signer archive will be named differently
                  # pattern: ${{ env.tag }}-binary-build-linux-${{ env.build_arch }}*
                  path: /tmp/release
                  merge-multiple: true

            - name: Check Data
              id: check_data
              shell: bash
              run: |
                  echo "pwd:"
                  pwd
                  echo "checking release dir:"
                  ls -al /tmp/release

            ## Setup Docker for the builds
            ##
            ## note: we can disable the vm cleanup for this. at a minimum, we can use /mnt for ops
            ##
            # Setup Docker for the builds
            ## Setup Docker for the builds
            - name: Docker setup
              id: docker_setup
              uses: wileyj/actions/docker@chore/update_docker_comp
              with:
                  registry: ${{ env.docker_registry }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            ## Checkout the code
            - name: Checkout the latest code
              id: git_checkout
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
              with:
                  ref: ${{ env.BRANCH_NAME }}
                  sparse-checkout: |
                      .github

            - name: Docker Metadata ( ${{matrix.dist}} )
              id: docker_metadata
              uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 #v5.9.0
              with:
                  # tag images with current repo name `stacks-core` as well as legacy `stacks-blockchain`
                  images: |
                      ${{ env.docker_images }}
                  labels: |
                      org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss.SSS[Z]'}}
                      org.opencontainers.image.version=${{ env.docker_tag }}
                  tags: |
                      ## tags are broken :(
                      #
                      # ghcr.io/wileyj/stacks-core
                      # ghcr.io/wileyj/stacks-blockchain:latest
                      # ghcr.io/wileyj/stacks-core
                      # ghcr.io/wileyj/stacks-blockchain:4.0.0.0.0-debian
                      # ghcr.io/wileyj/stacks-core
                      # ghcr.io/wileyj/stacks-blockchain:4.0.0.0.0
                      #
                      #   https://github.com/docker/metadata-action?tab=readme-ov-file#typeraw
                      #
                      # debian tags
                      type=raw,value=latest,enable=${{ env.docker_tag != '' && env.docker_tag_rc != 'true' && matrix.dist == 'debian' }}
                      type=raw,value=${{ env.docker_tag }},suffix=-${{ matrix.dist }},enable=${{ env.docker_tag != '' && matrix.dist == 'debian'}}
                      type=raw,value=${{ env.docker_tag }},suffix=-${{ matrix.dist }},enable=${{ env.docker_tag != '' && matrix.dist == 'debian' }}
                      type=ref,event=tag,enable=${{ matrix.dist == 'debian' }}
                      # alpine tags
                      type=raw,value=latest,suffix=-${{ matrix.dist }},enable=${{ env.docker_tag != '' && env.docker_tag_rc != 'true' && matrix.dist == 'alpine' }}
                      type=raw,value=${{ env.docker_tag }},suffix=-${{ matrix.dist }},enable=${{ env.docker_tag != '' && matrix.dist == 'alpine' }}

            ## Build docker image for node release
            - name: Show vals ( ${{matrix.dist}} )
              id: show_vals
              shell: bash
              run: |
                  echo "env.build_arch: ${{ env.build_arch }}"
                  echo "env.tag: ${{ env.tag }}"
                  echo "env.docker_tag: ${{env.docker_tag}}"
                  echo "env.docker_org: ${{env.docker_org}}"
                  echo "docker_tag_rc: ${{ env.docker_tag_rc }}"
                  echo "env.docker_images: ${{env.docker_images}}"
                  echo "platforms: ${{ env.docker_platforms }}"
                  echo
                  echo "metadata:"
                  echo "    tags: ${{ steps.docker_metadata.outputs.tags }}"
                  echo "    labels: ${{ steps.docker_metadata.outputs.labels }}"
                  echo
                  echo "node_tag: ${{inputs.node_tag}}"
                  echo "node_docker_tag: ${{inputs.node_docker_tag}}"
                  echo "signer_tag: ${{inputs.signer_tag}}"
                  echo "signer_docker_tag: ${{inputs.signer_docker_tag}}"
                  echo "release_type: ${{inputs.release_type}}"
                  echo
                  echo "push: ${{ env.DOCKER_PUSH }}"
                  echo
                  echo "Artifact pattern: ${{ env.tag }}-binary-build-linux-${{ env.build_arch }}*"
                  echo

            - name: Build and Push ( ${{matrix.dist}} )
              id: docker_build
              uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
              with:
                  sbom: false
                  provenance: ${{ env.provenance }}
                  context: /tmp
                  file: ./.github/actions/dockerfiles/${{ matrix.dist }}/Dockerfile.release
                  platforms: ${{ env.docker_platforms }}
                  tags: ${{ steps.docker_metadata.outputs.tags }}
                  labels: ${{ steps.docker_metadata.outputs.labels }}
                  push: ${{ env.DOCKER_PUSH }}

            ## Generate docker image attestation(s)
            - name: Generate artifact attestation (${{ github.event.repository.name }})
              id: attest_primary
              uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
              with:
                  subject-name: ${{env.docker_registry}}/${{ github.repository_owner }}/${{ inputs.release_type }} # attest for stacks-core|stacks-signer
                  subject-digest: ${{ steps.docker_build.outputs.digest }}
                  push-to-registry: ${{ env.DOCKER_PUSH }}

            # - name: Generate artifact attestation (stacks-blockchain)
            #   if: |
            #     inputs.release_type == 'stacks-core'
            #   id: attest_secondary
            #   uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
            #   with:
            #       subject-name: ${{env.docker_registry}}/${{ github.repository_owner }}/stacks-blockchain # attest for stacks-blockchain (only for stacks-core)
            #       subject-digest: ${{ steps.docker_build.outputs.digest }}
            #       push-to-registry: ${{ env.DOCKER_PUSH }}
