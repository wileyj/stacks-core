            #           GIT_BRANCH=${{ env.GITHUB_REF_SHORT }}
            #           GIT_COMMIT=${{ env.GITHUB_SHA_SHORT }}
            #       push: ${{ env.DOCKER_PUSH }}

            # ## Generate docker image attestation(s)
            # - name: Generate artifact attestation (${{ github.event.repository.name }})
