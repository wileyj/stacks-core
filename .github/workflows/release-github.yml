## Github workflow to create a github release and upload binary artifacts

name: Github Release

on:
    workflow_call:
        inputs:
            node_tag:
                description: "Node Release Tag"
                required: true
                type: string
            node_docker_tag:
                description: "Node Docker Release Tag"
                required: true
                type: string
            signer_tag:
                description: "Signer Release Tag"
                required: true
                type: string
            signer_docker_tag:
                description: "Signer Docker Release Tag"
                required: true
                type: string
            is_node_release:
                description: "True if it is a node release"
                required: true
                type: string
            is_signer_release:
                description: "True if it is a signer release"
                required: true
                type: string

concurrency:
    group: release-github-${{ github.head_ref || github.ref }}
    ## Always cancel duplicate jobs
    cancel-in-progress: true

run-name: ${{ inputs.node_tag || inputs.signer_tag }}

jobs:
    ## Build arch dependent binaries from source
    ##
    ## Runs when the following is true:
    ##  - either node or signer tag is provided
    andon-cord:
        if: |
            inputs.node_tag != '' ||
            inputs.signer_tag != ''
        name: Andon Cord
        runs-on: ubuntu-latest
        environment: "Push to Docker"
        steps:
            - name: Check Approval
              id: check
              run: |
                  exit 0
    build-binaries:
        if: |
            inputs.node_tag != '' ||
            inputs.signer_tag != ''
        name: Build Binaries
        needs:
            - andon-cord
        uses: ./.github/workflows/release-build.yml
        with:
            node_tag: ${{ inputs.node_tag }}
            signer_tag: ${{ inputs.signer_tag }}

    docker-images:
        if: |
            inputs.node_tag != '' ||
            inputs.signer_tag != ''
        name: Build Docker Images
        secrets: inherit
        needs:
            - andon-cord
            - build-binaries
        strategy:
            fail-fast: false
            ## Build a maximum of 2 images concurrently based on matrix.dist
            max-parallel: 2
            matrix:
                type:
                    - stacks-node
                    - stacks-signer
                exclude:
                    - type: ${{ inputs.is_node_release == 'false' && 'stacks-node' }}
        ## Creates the node docker image
        uses: ./.github/workflows/release-docker.yml
        with:
            node_tag: ${{ inputs.node_tag }} # used
            node_docker_tag: ${{ inputs.node_docker_tag }} # can be removed, use [node,signer]_tag
            signer_tag: ${{ inputs.signer_tag }}
            signer_docker_tag: ${{ inputs.signer_docker_tag }} # can be removed, use [node,signer]_tag
            release_type: ${{ matrix.type }}

    ####
    # ## Runs when the following is true:
    # ##  - either node or signer tag is provided
    create-release:
        if: |
            inputs.node_tag != '' ||
            inputs.signer_tag != ''
        name: Create Release
        runs-on: ubuntu-latest
        needs:
            - andon-cord
            - build-binaries
            - docker-images
        permissions:
            contents: write
        steps:
            ## Creates releases
            - name: Create Release
              id: check
              run: |
                  exit 0
    #           uses: stacks-network/actions/stacks-core/release/create-releases@main
    #           with:
    #               node_tag: ${{ inputs.node_tag }}
    #               node_docker_tag: ${{ inputs.node_docker_tag }}
    #               signer_tag: ${{ inputs.signer_tag }}
    #               signer_docker_tag: ${{ inputs.signer_docker_tag }}
    #               is_node_release: ${{ inputs.is_node_release }}
    #               is_signer_release: ${{ inputs.is_signer_release }}
    #               GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ## Create the downstream PR for the release branch to master,develop
    create-pr:
        if: |
            inputs.node_tag != '' ||
            inputs.signer_tag != ''
        name: Create Downstream PR (${{ github.ref_name }})
        runs-on: ubuntu-latest
        needs:
            - andon-cord
            - build-binaries
            - create-release
            - docker-images
        # permissions:
        #     pull-requests: write
        steps:
            - name: Open Downstream PR
              id: check
              run: |
