## Github workflow to create a github release and upload binary artifacts

name: Github Release

on:
  workflow_call:
    # inputs:
    #   node_tag:
    #     description: "Node Docker Release Tag"
    #     required: true
    #     type: string
    #   signer_tag:
    #     description: "Signer Docker Release Tag"
    #     required: true
    #     type: string
    #   is_node_release:
    #     description: "True if it is a node release"
    #     required: true
    #     type: string

permissions:
  contents: read

concurrency:
  group: release-github-${{ github.head_ref || github.ref }}
  ## Always cancel duplicate jobs
  cancel-in-progress: true

run-name: Build Release

jobs:
  check-release:
    name: Check Release
    runs-on: ubuntu-latest
    outputs:
      node_tag: ${{ steps.check-release.outputs.node_tag }}
      node_docker_tag: ${{ steps.check-release.outputs.node_docker_tag }}
      signer_tag: ${{ steps.check-release.outputs.signer_tag }}
      signer_docker_tag: ${{ steps.check-release.outputs.signer_docker_tag }}
      is_node_release: ${{ steps.check-release.outputs.is_node_release }}
      is_signer_release: ${{ steps.check-release.outputs.is_signer_release }}
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          sparse-checkout: |
            .github

      ## Check if this is a release
      - name: Check Release
        id: check-release
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash ./.github/scripts/check_release.sh
  ## Build arch dependent binaries from source
  ##
  ## Runs when the following is true:
  ##  - either node or signer tag is provided
  andon-cord:
    name: Andon Cord
    needs:
      - check-release
    if: |
      needs.check-release.outputs.is_node_release == 'true' ||
      needs.check-release.outputs.is_signer_release == 'true'
      # inputs.node_tag != '' ||
      # inputs.signer_tag != ''
    runs-on: ubuntu-latest
    environment: "Build Release"
    steps:
      - name: Check Approval
        run: |
          exit 0

  build-binaries:
    name: Build Binaries
    needs:
      - andon-cord
      - check-release
    if: |
      needs.check-release.outputs.is_node_release == 'true' ||
      needs.check-release.outputs.is_signer_release == 'true'
      # inputs.node_tag != '' ||
      # inputs.signer_tag != ''
    permissions:
      contents: read       # required for checkout inside release-build.yml
      id-token: write      # required for attestation inside release-build.yml
      attestations: write  # required for attestation inside release-build.yml
    uses: ./.github/workflows/release-build.yml
    with:
      node_tag: ${{ needs.check-release.outputs.node_tag }} # used to conditionally run step in release-build.yml
      signer_tag: ${{ needs.check-release.outputs.signer_tag }} # used to conditionally run step in release-build.yml

  docker-images:
    name: Build Docker Images
    needs:
      - andon-cord
      - check-release
      - build-binaries
    if: |
      needs.check-release.outputs.is_node_release == 'true' ||
      needs.check-release.outputs.is_signer_release == 'true'
      # inputs.node_tag != '' ||
      # inputs.signer_tag != ''
    permissions:
      contents: read       # required for checkout inside release-docker.yml
      id-token: write      # required for attestation inside release-docker.yml
      attestations: write  # required for attestation inside release-docker.yml
      packages: write      # required for image push inside release-docker.yml
    strategy:
      fail-fast: false
      ## Build a maximum of 2 images concurrently based on matrix.dist
      max-parallel: 2
      matrix:
        type:
          - stacks-core
          - stacks-signer
        exclude:
          - type: ${{ inputs.is_node_release == 'false' && 'stacks-core' }} # exclude stacks-core if node release is false
    ## Creates the node docker image
    uses: ./.github/workflows/release-docker.yml
    with:
      node_tag: ${{ inputs.node_tag }} # node_tag will contains the 5 char node version, i.e. 3.3.0.0.0
      signer_tag: ${{ inputs.signer_tag }} # signer_tag contains 6 char signer version, i.e. 3.3.0.0.0.1
      release_type: ${{ matrix.type }} # one of stacks-signer or stacks-core
  ##
  ## Runs when the following is true:
  ##  - either node or signer tag is provided
  create-release:
    name: Create Release
    needs:
      - andon-cord
      - check-release
      - build-binaries
      - docker-images
    if: |
      needs.check-release.outputs.is_node_release == 'true' ||
      needs.check-release.outputs.is_signer_release == 'true'
      # inputs.node_tag != '' ||
      # inputs.signer_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      ## Creates releases
      - name: Create Release
        uses: ./.github/actions/release/create-releases
        with:
          node_tag: ${{ needs.check-release.outputs.node_tag }} # name used for release (use the version by itself
          signer_tag: signer-${{ needs.check-release.outputs.signer_tag }} # name used for release (prefix with 'signer-')
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
