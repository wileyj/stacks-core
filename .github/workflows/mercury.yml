# Github workflow to run full genesis and unit tests

name: Mercury

on:
  workflow_dispatch:

# set default permissions
permissions:
  contents: read
# env vars are transferred to composite action steps
env:
  BITCOIND_TEST: 1
  RUST_BACKTRACE: full
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 3
  TEST_TIMEOUT: 30
  CI: true  # Required by insta snapshot tests to run in CI

# configure concurrency
concurrency:
  group: stacks-core-tests-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  rustfmt:
    name: Rust Format
    # needs: changelog-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      # Setup the rust toolchain with specified rustfmt
      # - name: Setup Rust Toolchain
      #   uses: ./.github/actions/setup-rust-toolchain
      #   with:
      #     components: rustfmt
      - name: Setup Rust Toolchain
        id: setup_rust_toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1.15.4
        with:
          components: rustfmt
          cache: false

      ## Check if this is a release
      - name: Rustfmt
        run: bash ./.github/scripts/rustfmt.sh

