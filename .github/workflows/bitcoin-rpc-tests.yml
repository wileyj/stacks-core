## Github workflow to run bitcoin RPC tests over multiple versions of Bitcoin Core

name: Tests::Bitcoin RPC

on:
  workflow_dispatch:
    inputs:
      build-cache:
        type: boolean
        default: true
        description: Build the test cache before running tests
  workflow_call:
    inputs:
      build-cache:
        type: boolean
        default: false
        description: Build the test cache (set false when called from ci.yml which builds its own cache)

permissions:
  contents: read

env:
  RUST_BACKTRACE: full
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
  TEST_TIMEOUT_MINS: 5
  DISCOVER_TIMEOUT_MINS: 5
  # Minimum Bitcoin Core major version to start discovering Docker tags from.
  START_MAJOR: "25"

concurrency:
  group: bitcoin-rpc-tests-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ## Always run create-cache regardless of trigger — downstream jobs depend on it.
  create-cache:
    name: Create Test Cache
    if: ${{ inputs.build-cache }}
    uses: ./.github/workflows/create-cache.yml

  # this job may run while the cache is verifying/building
  discover-bitcoin-majors:
    name: Discover Bitcoin Majors
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.discover.outputs.versions }}
    steps:
      - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      ## Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      - name: Discover available Bitcoin major tags on dockerhub
        id: discover
        timeout-minutes: ${{ fromJSON(env.DISCOVER_TIMEOUT_MINS) }}
        run: |
          set -euo pipefail

          result_json="$(bash ./.github/scripts/docker_bitcoin_majors.sh "$START_MAJOR")"
          echo "$result_json" | jq .

          versions_json="$(jq -c '.versions' <<< "$result_json")"

          if [[ -z "$versions_json" ]]; then
            echo "Unable to parse versions JSON from script output."
            exit 1
          fi

          echo "versions=$versions_json" >> "$GITHUB_OUTPUT"

  test-rpc:
    name: Test Bitcoin (${{ matrix.bitcoin_version }})
    needs:
      - discover-bitcoin-majors
      - create-cache
    if: always() && !cancelled() && needs.create-cache.result != 'failure' && needs.discover-bitcoin-majors.result != 'failure'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bitcoin_version: ${{ fromJSON(needs.discover-bitcoin-majors.outputs.versions) }}

    steps:
      - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      ## Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      - name: Setup Test Environment
        uses: ./.github/actions/testenv

      - name: Pull bitcoind image (${{ matrix.bitcoin_version }})
        run: docker pull bitcoin/bitcoin:${{ matrix.bitcoin_version }}

      - name: Run tests on bitcoind ${{ matrix.bitcoin_version }}
        timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT_MINS) }}
        env:
          BITCOIN_IMAGE_TAG: ${{ matrix.bitcoin_version }}
        run: |
          cargo nextest run \
            --archive-file ~/test_archive.tar.zst \
            --fail-fast \
            --status-level fail \
            --run-ignored all \
            --no-tests fail \
            -E 'package(stacks-node) & binary(stacks-node) & test(/^tests::bitcoin::rpc_integrations::/)'

  check-tests:
    name: Check Tests
    needs:
      - test-rpc
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      ## Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      ## Check if all jobs succeeded
      - name: Check Tests Status
        uses: ./.github/actions/check-jobs-status
        with:
          jobs: ${{ toJson(needs) }}
          summary_print: "true"
