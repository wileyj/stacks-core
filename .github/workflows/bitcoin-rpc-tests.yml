## Github workflow to run bitcoin RPC tests over multiple versions of Bitcoin Core

name: Tests::Bitcoin RPC

on:
  workflow_dispatch:
  workflow_call:

env:
  RUST_BACKTRACE: full
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
  TEST_TIMEOUT_MINS: 5
  DISCOVER_TIMEOUT_MINS: 5
  # Minimum Bitcoin Core major version to start discovering Docker tags from.
  START_MAJOR: "25"

jobs:
  # if triggered manually, create the cache
  create-cache:
    if: always() && github.event_name == 'workflow_dispatch'
    name: Create Test Cache
    uses: ./.github/workflows/create-cache.yml

  discover-bitcoin-majors:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.discover.outputs.versions }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
          sparse-checkout: |
            .github

      - name: Discover available major tags on Docker Hub
        id: discover
        timeout-minutes: ${{ fromJSON(env.DISCOVER_TIMEOUT_MINS) }}
        run: |
          set -euo pipefail

          result_json="$(bash ./.github/workflows/scripts/docker-bitcoin-majors.sh "$START_MAJOR")"
          echo "$result_json" | jq .

          versions_json="$(jq -c '.versions' <<< "$result_json")"

          if [[ -z "$versions_json" ]]; then
            echo "Unable to parse versions JSON from script output."
            exit 1
          fi

          echo "versions=$versions_json" >> "$GITHUB_OUTPUT"

  test-rpc:
    needs: discover-bitcoin-majors
    name: test-rpc-bitcoin:${{ matrix.bitcoin_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bitcoin_version: ${{ fromJSON(needs.discover-bitcoin-majors.outputs.versions) }}

    steps:
      ## Checkout the code
      - name: Checkout the latest code
        id: git_checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      - name: Setup Test Environment
        id: setup_tests
        uses: ./.github/actions/testenv

      - name: Pull bitcoind image ${{ matrix.bitcoin_version }}
        run: docker pull bitcoin/bitcoin:${{ matrix.bitcoin_version }}

      - name: Run tests on bitcoind ${{ matrix.bitcoin_version }}
        timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT_MINS) }}
        env:
          BITCOIN_IMAGE_TAG: ${{ matrix.bitcoin_version }}
        run: |
          cargo nextest run \
            --archive-file ~/test_archive.tar.zst \
            --fail-fast \
            --status-level fail \
            --run-ignored all \
            --no-tests fail \
            -E 'package(stacks-node) & binary(stacks-node) & test(/^tests::bitcoin::rpc_integrations::/)'

  check-tests:
    name: Check Tests
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test-rpc
    steps:
      ## Checkout the code
      - name: Checkout the latest code
        id: git_checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      ## Check if all jobs succeeded
      - name: Check Tests Status
        id: check_tests_status
        uses: ./.github/actions/check-jobs-status
        with:
          jobs: ${{ toJson(needs) }}
          summary_print: "true"
