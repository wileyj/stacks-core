## Github workflow to run sbtc tests

name: Tests::SBTC

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

## env vars are transferred to composite action steps
env:
  BITCOIND_TEST: 1
  RUST_BACKTRACE: full
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 15
  TEST_TIMEOUT: 30

concurrency:
  group: sbtc-tests-${{ github.head_ref || github.ref || github.run_id}}
  ## Only cancel in progress if this is for a PR
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # if triggered manually, create the cache
  create-cache:
    if: always() && github.event_name == 'workflow_dispatch'
    name: Create Test Cache
    uses: ./.github/workflows/create-cache.yml

  # Bitcoin integration tests with code coverage
  sbtc-tests:
    name: SBTC Tests
    needs: create-cache
    runs-on: ubuntu-latest
    strategy:
      ## Continue with the test matrix even if we've had a failure
      fail-fast: false
      ## Run a maximum of 32 concurrent tests from the test matrix
      max-parallel: 32
      matrix:
        test-name:
          - tests::stackerdb::test_stackerdb_event_observer
          - tests::stackerdb::test_stackerdb_load_store
    steps:
      ## Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      ## Setup test environment
      - name: Setup Test Environment
        uses: ./.github/actions/testenv

      ## Run test matrix using restored cache of archive file
      ##   - Test will timeout after env.TEST_TIMEOUT minutes
      - name: Run Tests
        timeout-minutes: ${{ fromJSON(env.TEST_TIMEOUT) }}
        uses: ./.github/actions/run-tests
        with:
          test-name: ${{ matrix.test-name }}

      ## Create and upload code coverage file
      - name: Code Coverage
        uses: ./.github/actions/codecov
        with:
          test-name: ${{ matrix.test-name }}

  check-tests:
    name: Check Tests
    needs:
      - sbtc-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      ## Checkout the code
      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      ## Check if all jobs succeeded
      - name: Check Tests Status
        uses: ./.github/actions/check-jobs-status
        with:
          jobs: ${{ toJson(needs) }}
          summary_print: "true"
