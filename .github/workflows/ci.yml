## The main Github Actions workflow
name: CI

on:
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - "**.md"
      - "**.yml"
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read  # default for all jobs

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.head_ref || github.ref || github.run_id }}
  ## Always cancel duplicate jobs
  cancel-in-progress: true

run-name: ${{ github.ref_name }}

jobs:
  changelog-check:
    name: Changelog Check
    runs-on: ubuntu-latest
    steps:
      # - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
      #   with:
      #     egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      - name: Check for changelog fragments
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const changelog = require('./.github/scripts/changelog.js');
            await changelog({ github, context, core });

  rustfmt:
    name: Rust Format
    needs: changelog-check
    runs-on: ubuntu-latest
    steps:
      # - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
      #   with:
      #     egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Setup Rust Toolchain
        uses: ./.github/actions/setup-rust-toolchain
        with:
          components: rustfmt

      ## Check if this is a release
      - name: Rustfmt
        run: bash ./.github/scripts/rustfmt.sh

      # - name: Rustfmt
      #   uses: ./.github/actions/rustfmt
      #   with:
      #     alias: "fmt-stacks"

  ######################################################################################
  ## Check if the branch that this workflow is being run against is a release branch
  ##
  ## Outputs:
  ##  - node_tag: Tag of the stacks-node if the branch is a release one (example: release/3.4.0.0.1), null otherwise
  ##  - node_docker_tag: Version of the stacks-node if the branch is a release one (example: 3.4.0.0.1), null otherwise
  ##  - signer_tag: Tag of the stacks-signer if the branch is a release one (example: release/3.4.0.0.1.0), null otherwise
  ##  - signer_docker_tag: Version of the stacks-signer if the branch is a release one (example: 3.4.0.0.1.0), null otherwise
  ##  - is_node_release: True if the branch represents a 'stacks-node' release, false otherwise.
  ##                     If this is true, 'is_signer_release' will also be true, since a 'stacks-signer' binary
  ##                     is always released alongside 'stacks-node'.
  ##  - is_signer_release: True if the branch represents a 'stacks-signer' release, false otherwise.
  check-release:
    ##
    ## this can be moved to github-release.yml
    ##
    name: Check Release
    needs:
      - rustfmt
      - changelog-check
    runs-on: ubuntu-latest
    outputs:
      node_tag: ${{ steps.check-release.outputs.node_tag }} # not used
      # node_docker_tag: ${{ steps.check-release.outputs.node_docker_tag }} # used by create-release as node-tag
      signer_tag: ${{ steps.check-release.outputs.signer_tag }} # not used
      # signer_docker_tag: ${{ steps.check-release.outputs.signer_docker_tag }} # used by create-release as signer-tag
      is_node_release: ${{ steps.check-release.outputs.is_node_release }} # used by create-release and in conditionals to trigger jobs
      is_signer_release: ${{ steps.check-release.outputs.is_signer_release }} # used in conditionals to trigger jobs
    steps:
      # - uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
      #   with:
      #     egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout the latest code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          sparse-checkout: |
            .github

      ## Check if this is a release
      - name: Check Release
        id: check-release
        env:
          BRANCH: ${{ github.ref_name }}
        run: bash ./.github/scripts/check_release.sh

  ######################################################################################
  ## Create a tagged github release
  ##
  ## Runs when:
  ##  - it is either a node release or a signer release

  ## create-release will call the reusable workflows to:
  #   - build the binary artifacts
  #   - create the release docker images
  #   - create the github release.
  create-release:
    if: >-
      !cancelled() &&
      (needs.check-release.outputs.is_node_release == 'true' ||
      needs.check-release.outputs.is_signer_release == 'true')
    name: Create Release
    needs:
      - rustfmt
      - changelog-check
      - check-release
    permissions:
      contents: write      # required for release in github-release.yml
      id-token: write      # required for attestation inside release-build.yml / release-docker.yml
      attestations: write  # required for attestation inside release-build.yml / release-docker.yml
      packages: write      # required for image push inside release-docker.yml
    # secrets: inherit
    uses: ./.github/workflows/release-github.yml
    with:
      node_tag: ${{ needs.check-release.outputs.node_tag }} # 5 place version format like x.x.x.x.x
      signer_tag: ${{ needs.check-release.outputs.signer_tag }} # 6 place version format like x.x.x.x.x.x
      is_node_release: ${{ needs.check-release.outputs.is_node_release }} # used in matrix conditional in release-github.yml


