## Github workflow to create reusable caches

name: Create Test Cache

on:
  workflow_dispatch:
  workflow_call:

## env vars are transferred to composite action steps
env:
  RUSTFLAGS: "-Cinstrument-coverage -Awarnings"
  LLVM_PROFILE_FILE: "stacks-core-%p-%m.profraw"
  BTC_VERSION: "25.0"

##
## Cache will exist longer than workflow execution so other runners have access
##   however, this is only relevant if the commit sha does not change between runs
concurrency:
  group: create-cache-${{ github.head_ref || github.ref || github.run_id}}
  ## Only cancel in progress if this is for a PR
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ## Cache cargo data
  cargo:
    name: Cargo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the latest code
        id: git_checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          ref: ${{ github.base_ref }}
      ## Perform a lookup to check if the cache already exists
      - name: Cargo Cache
        id: cargo-cache
        uses: ./.github/actions/cache/cargo
        with:
          action: save

  ## Cache the bitcoin binary
  bitcoin-binary:
    name: Bitcoin Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the latest code
        id: git_checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          ref: ${{ github.base_ref }}
      - name: Bitcoin Cache
        id: bitcoin-cache
        uses: ./.github/actions/cache/bitcoin
        with:
          action: save
          btc-version: "25.0"

  ## Cache nextest archives for tests
  nextest-archive:
    name: Test Archive
    runs-on: ubuntu-latest
    needs:
      - cargo
    steps:
      - name: Checkout the latest code
        id: git_checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          ref: ${{ github.base_ref }}
      - name: Build Nexttest Cache
        id: nextest-cache
        uses: ./.github/actions/cache/test-archive
        with:
          fail-on-cache-miss: false
        # uses: ./.github/actions/cache/build-cache
