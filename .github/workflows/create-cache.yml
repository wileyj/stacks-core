## Github workflow to create reusable caches

name: Create Test Cache

on:
  workflow_dispatch:
  workflow_call:

## env vars are transferred to composite action steps
env:
  RUSTFLAGS: "-Cinstrument-coverage -Awarnings"
  LLVM_PROFILE_FILE: "stacks-core-%p-%m.profraw"
  BTC_VERSION: "25.0"
  CARGO_INCREMENTAL: 1

##
## Cache will exist longer than workflow execution so other runners have access
##   however, this is only relevant if the commit sha does not change between runs
concurrency:
  group: create-cache-${{ github.head_ref || github.ref || github.run_id}}
  ## Only cancel in progress if this is for a PR
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ## Check which caches already exist before spinning up creation jobs
  check-caches:
    name: Check Caches
    runs-on: ubuntu-latest
    outputs:
      bitcoin-cache-hit: ${{ steps.bitcoin.outputs.cache-hit }}
      cargo-cache-hit: ${{ steps.cargo.outputs.cache-hit }}
      cargo-target-cache-hit: ${{ steps.cargo-target.outputs.cache-hit }}
      test-archive-cache-hit: ${{ steps.test-archive.outputs.cache-hit }}
    steps:
      - name: Checkout the latest code
        id: git_checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
      - name: Check Bitcoin Cache
        id: bitcoin
        uses: ./.github/actions/cache/bitcoin
      - name: Check Cargo Cache
        id: cargo
        uses: ./.github/actions/cache/cargo
      - name: Check Cargo Target Cache
        id: cargo-target
        uses: ./.github/actions/cache/cargo-target
      - name: Check Test Archive Cache
        id: test-archive
        uses: ./.github/actions/cache/test-archive

  ## Cache cargo data
  cargo:
    name: Cargo
    runs-on: ubuntu-latest
    needs: check-caches
    if: needs.check-caches.outputs.cargo-cache-hit != 'true'
    steps:
      - name: Checkout the latest code
        id: git_checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref }}
          sparse-checkout: |
            .github

      - name: Cargo Cache
        id: cargo-cache
        uses: ./.github/actions/cache/cargo
        with:
          action: save

  ## Cache the bitcoin binary
  bitcoin-binary:
    name: Bitcoin Binary
    runs-on: ubuntu-latest
    needs: check-caches
    if: needs.check-caches.outputs.bitcoin-cache-hit != 'true'
    steps:
      - name: Checkout the latest code
        id: git_checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref || github.ref }}
          sparse-checkout: |
            .github
      - name: Bitcoin Cache
        id: bitcoin-cache
        uses: ./.github/actions/cache/bitcoin
        with:
          action: save


  # echo:
  #   name: Echo
  #   runs-on: ubuntu-latest
  #   needs:
  #     - check-caches
  #     - cargo
  #   if: |
  #     always()
  #   steps:
  #     - name: echo
  #       shell: bash
  #       run: |
  #           echo "needs.cargo.result: ${{ needs.cargo.result }}"
  #           echo "needs.check-caches.outputs.cargo-target-cache-hit: ${{ needs.check-caches.outputs.cargo-target-cache-hit }}"
  #           echo "needs.check-caches.outputs.test-archive-cache-hit: ${{ needs.check-caches.outputs.test-archive-cache-hit }}"


  ## Cache nextest archives for tests
  nextest-archive:
    name: Test Archive
    runs-on: ubuntu-latest
    needs:
      - check-caches
      - cargo
    ## Run if test-archive is missing; tolerate cargo being skipped (cache already existed)
    #   - if the cargo target cache (or the test-archive cache) is missing, then we'll need to reuild the test archive and cache both the archive and cargo target (for code coverage).
    if: |
      always() &&
      needs.cargo.result == 'success' || needs.cargo.result == 'skipped' &&
      (
        needs.check-caches.outputs.cargo-target-cache-hit != 'true' ||
        needs.check-caches.outputs.test-archive-cache-hit != 'true'
      )
    steps:
      - name: Checkout the latest code
        id: git_checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Build Nextest Cache
        id: nextest-cache
        uses: ./.github/actions/cache/build-cache
